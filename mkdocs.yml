# 站点信息
site_name: Jagger | Blog
site_url: https://jagger235711.github.io/
site_description: Jagger 的个人博客
site_author: Jagger G

# 仓库信息
repo_url: https://github.com/jagger235711/jagger235711.github.io
repo_name: jagger235711/jagger235711.github.io
edit_uri: "edit/origin/docs/"

# 主题配置
theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    # 导航功能
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.prune
    # 搜索功能
    - search.suggest
    - search.highlight
    # 内容编辑
    - content.action.edit
    # 目录
    - toc.follow
    - toc.integrate
  palette: # 调整网页皮肤
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/lightbulb
        name: 进入夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: 进入日间模式
  icon:
    repo: fontawesome/brands/github

# 插件配置
plugins:
  - blog:
      post_date_format: full
      categories_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - git-revision-date-localized:
      enable_creation_date: true
  - search:
      lang:
        - en
        - zh
      separator: '[\s\u200b\-]'
  - glightbox

# Markdown扩展
markdown_extensions:
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# 额外JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 版权信息
copyright: Copyright &copy; 2013 - 2025 Jagger G

# 导航结构
nav:
  - 首页: index.md
  - 博客:
      - blog/index.md
  - 关于我:
      - aboutMe/index.md
