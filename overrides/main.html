{% extends "base.html" %}

{% block htmltitle %}
    <title>Jagger的博客</title>
{% endblock %}

{% block footer %}
    {{ super() }}
    <p>总访问量: <span id="qiushaocloud_sitecounter_value_site_pv">n</span></p>
    <p>总访客量: <span id="qiushaocloud_sitecounter_value_site_uv">n</span></p>
    <p>今日访问量: <span id="qiushaocloud_sitecounter_value_today_site_pv">n</span></p>
    <p>今日访客量: <span id="qiushaocloud_sitecounter_value_today_site_uv">n</span></p>
{% endblock %}

<!-- Theme-related JavaScript -->
{% block scripts %}
    {{ super() }}

    <!-- Extra JavaScript (can't be set in mkdocs.yml due to content hash) -->
    <script src="{{ 'assets/javascripts/custom.js' | url }}"></script>
    <script async
        src="//githubcdn.qiushaocloud.top/gh/qiushaocloud/site-counter@master/dist/qiushaocloud_site_counter.min.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8690148457159328"
    crossorigin="anonymous"></script>
{% endblock %}
